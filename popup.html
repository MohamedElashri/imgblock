<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <style>
    body {
      width: 200px;
      padding: 15px;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      margin: 0;
    }
    
    h3 {
      margin: 0 0 15px 0;
      font-size: 14px;
      color: #333;
    }
    
    button {
      width: 100%;
      padding: 10px;
      margin-bottom: 8px;
      border: none;
      border-radius: 5px;
      font-size: 13px;
      font-weight: 500;
      cursor: pointer;
      transition: all 0.2s;
    }
    
    #blockBtn {
      background-color: #e74c3c;
      color: white;
    }
    
    #blockBtn:hover:not(:disabled) {
      background-color: #c0392b;
    }
    
    #restoreBtn {
      background-color: #27ae60;
      color: white;
    }
    
    #restoreBtn:hover:not(:disabled) {
      background-color: #229954;
    }
    
    button:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }
    
    .support-link {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      color: #813548;
      font-size: 13px;
      font-weight: 600;
      margin-top: 8px;
      padding: 5px 8px;
      border: 1px solid #bb8595;
      border-radius: 5px;
      background: #fff5f7;
      text-decoration: none;
    }

    .support-link:hover { text-decoration: underline; }

    #status {
      margin-top: 10px;
      padding: 8px;
      font-size: 12px;
      text-align: center;
      border-radius: 3px;
      display: none;
    }
    
    #status.success {
      background-color: #d4edda;
      color: #155724;
      display: block;
    }
    
    #status.error {
      background-color: #f8d7da;
      color: #721c24;
      display: block;
    }
  </style>
</head>
<body>
  <h3>ImgBlock</h3>
  <button id="blockBtn">Block Images</button>
  <button id="restoreBtn" disabled>Restore Images</button>
  <div id="status" role="status"></div>
  <footer aria-label="About ImgBlock"><a class="support-link" href="https://ko-fi.com/melashri" target="_blank" rel="noopener noreferrer"><span aria-hidden="true">♥</span> Leave a tip on Ko-fi</a></footer>
  
  <script src="popup.js"></script>
</body>
</html>
